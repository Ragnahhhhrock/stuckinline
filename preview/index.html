<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d14">
<title>The Line</title>
<style>
:root {
  --bg: #0b0d14;
  --ink: #e9e6dc;
  --quiet: #8c93a6;
  --accent: #ffcf5c;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
  font: 16px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
body { background: #141623; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#labels { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
.lbl { position: absolute; left: 0; top: 0; display: none; padding: 1px 7px; border-radius: 999px; white-space: nowrap; transform-origin: 50% 100%;
  font: 600 13px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums;
  color: #f1eee3; background: #0b0d14b8; will-change: transform, opacity; }
.lbl.you { background: var(--accent); color: #14110a; }

/* Portrait phone first; desktop gets the same layout, centred */
#hud { position: fixed; top: calc(12px + var(--safe-t)); left: 0; right: 0; text-align: center; pointer-events: none; text-shadow: 0 1px 12px #000a; }
#pos { font-size: clamp(40px, 12vw, 64px); font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.05; }
#tally { color: var(--quiet); font-size: 15px; margin-top: 2px; font-variant-numeric: tabular-nums; }

#hint { position: fixed; top: calc(118px + var(--safe-t)); left: 24px; right: 24px; text-align: center; font-size: 13px; color: var(--quiet); opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
#hint.on { opacity: 0.85; }

#whisper { position: fixed; left: 24px; right: 24px; bottom: calc(84px + var(--safe-b)); text-align: center; font-style: italic;
  color: #cfd3e0; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; text-shadow: 0 1px 10px #000c; }
#whisper.on { opacity: 0.92; }

#bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px calc(12px + var(--safe-b)); background: linear-gradient(to top, #0b0d14ee, #0b0d1400); }
#status { color: var(--quiet); font-size: 14px; margin-right: auto; }
#bar button { padding: 10px 16px; }
button { font: inherit; color: #14110a; background: var(--accent); border: 0; border-radius: 999px; padding: 12px 20px; min-height: 44px; font-weight: 600; }
button.quiet { background: transparent; color: var(--ink); border: 1px solid #ffffff33; }
button:active { transform: scale(0.97); }

#front { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: #000; animation: fadein 1.6s ease forwards; }
#front[hidden], #after[hidden], #elsewhere[hidden] { display: none; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
#glow { position: absolute; inset: 0; animation: pulse 4s ease-in-out infinite; }
#front.v0 #glow { background: radial-gradient(60% 45% at 50% 40%, #fff6d8 0%, #f3d98a55 45%, #0000 75%); }
#front.v1 #glow { background: linear-gradient(to bottom, #0000 0%, #1b1710 60%, #0a0805 100%), radial-gradient(30% 12% at 50% 62%, #8a6a3a66 0%, #0000 100%); }
#front.v2 #glow { background: linear-gradient(90deg, #000 0%, #000 44%, #e9e1c4 49%, #e9e1c4 51%, #000 56%, #000 100%); opacity: 0.5; }
@keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
#after { position: relative; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; text-align: center; animation: fadein 2s ease; background: #000d; border-radius: 20px; padding: 20px; }
#finished { color: var(--quiet); margin: 0 0 12px; font-variant-numeric: tabular-nums; }
#after label { color: var(--ink); }
#wtext { width: 100%; font: inherit; color: var(--ink); background: #ffffff10; border: 1px solid #ffffff2a; border-radius: 12px; padding: 12px 14px; min-height: 44px; }
.row { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }

#elsewhere { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; background: #0b0d14f2; color: var(--quiet); }


:root { color-scheme: dark; }
#bar { flex-wrap: wrap; justify-content: flex-end; }
#status { flex: 1 1 auto; font-size: 13px; }
#speed { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 5; min-height: 36px; padding: 6px 14px; font-size: 13px; background: #0b0d14aa; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="labels" aria-hidden="true"></div>

<header id="hud">
  <div id="pos">#&ndash;</div>
  <div id="tally">joining the line&hellip;</div>
</header>

<div id="hint">Drag to look around &middot; two fingers to zoom and slide along the line</div>

<div id="whisper" aria-live="polite"></div>

<button id="speed" type="button" class="quiet">Speed up</button>

<footer id="bar">
  <div id="status">Simulated line</div>
  <button id="tofront" type="button" class="quiet">Front</button>
  <button id="find" type="button">Find me</button>
</footer>

<section id="front" hidden>
  <div id="glow"></div>
  <div id="after" hidden>
    <p id="finished"></p>
    <label for="wtext">Leave one line for whoever is behind you.</label>
    <input id="wtext" maxlength="60" autocomplete="off" placeholder="&hellip;">
    <div class="row">
      <button id="wsend" type="button">Leave it</button>
      <button id="rejoin" type="button" class="quiet">Join the back of the line</button>
    </div>
  </div>
</section>

<div id="elsewhere" hidden>Your place is open in another tab.</div>



<script type="module">

{

  bp(Box(0.17, 0.62, 0.18), { p: [x, 0.31, 0], c: 0xffffff }), // trousers (tinted per person)
  bp(Box(0.18, 0.08, 0.26), { p: [x, 0.04, -0.04], c: 0x16161c }), // shoes

  bp(Sph(0.036, 8, 6), { s: [1, 1.1, 0.55], p: [-0.078, 1.425, -0.178], c: 0xf4f1ea }), bp(Sph(0.036, 8, 6), { s: [1, 1.1, 0.55], p: [0.078, 1.425, -0.178], c: 0xf4f1ea }), // eyes

  bp(Box(0.07, 0.014, 0.014), { r: [0, 0, 0.12], p: [-0.078, 1.478, -0.185], c: 0x2a1d12 }), bp(Box(0.07, 0.014, 0.014), { r: [0, 0, -0.12], p: [0.078, 1.478, -0.185], c: 0x2a1d12 }), // brows
  bp(Box(0.075, 0.014, 0.012), { p: [0, 1.32, -0.19], c: 0x7a2a2a }), // mouth
], true);
const noseGeo = bp(Sph(0.032, 8, 6), { s: [0.8, 1.1, 1.3] });

  bp(new THREE.TorusGeometry(0.046, 0.008, 6, 14), { p: [-0.078, 1.427, -0.205], c: 0x1a1a22 }), bp(new THREE.TorusGeometry(0.046, 0.008, 6, 14), { p: [0.078, 1.427, -0.205], c: 0x1a1a22 }),
  bp(Box(0.04, 0.008, 0.008), { p: [0, 1.435, -0.205], c: 0x1a1a22 }),
  bp(Box(0.008, 0.008, 0.2), { p: [-0.14, 1.43, -0.1], c: 0x1a1a22 }), bp(Box(0.008, 0.008, 0.2), { p: [0.14, 1.43, -0.1], c: 0x1a1a22 }),

// hair: a cap sets the hairline; extra parts make each style's silhouette
const cap = (th) => bp(new THREE.SphereGeometry(0.212, 14, 8, 0, Math.PI * 2, 0, Math.PI * th), { s: [1, 1.1, 1.02], p: [0, HY, 0.012] });

const spikes = [bp(new THREE.ConeGeometry(0.05, 0.17, 5), { p: [0, 1.70, 0] })];
for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; spikes.push(bp(new THREE.ConeGeometry(0.045, 0.15, 5), { r: [Math.cos(a) * 0.55, 0, -Math.sin(a) * 0.55], p: [Math.sin(a) * 0.1, 1.66, Math.cos(a) * 0.1 + 0.01] })); }

  mergeParts([cap(0.38), rear(0.36, 0.70), bp(Box(0.40, 0.46, 0.09), { p: [0, 1.22, 0.15] })]), // 1 long

const mk = (geo, vc, dbl) => {

const hairMs = hairGeos.map((g) => mk(g, false, true));
const allMeshes = [shirtM, skinM, legLM, legRM, faceM, noseM, glassM, beardM, stacheM, ...hairMs];
const hiN = [0, 0, 0, 0, 0];
const M = new THREE.Matrix4(), T = new THREE.Matrix4(), T2 = new THREE.Matrix4(), S = new THREE.Matrix4(), Q = new THREE.Matrix4(), F = new THREE.Matrix4();
const YOU_COLOR = new THREE.Color(0xffcf5c);

// marker for you
const marker = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.34, 8).rotateX(Math.PI), new THREE.MeshBasicMaterial({ color: 0xffcf5c }));
const ring = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.52, 24).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffcf5c, transparent: true, opacity: 0.8 }));
marker.visible = ring.visible = false;
scene.add(marker, ring);

// ---------- the stage: velvet curtains over the way through ----------
// Once a minute the curtains part, the person at the head walks into the dark, and the curtains close.
const PW = 2.6, CH = 4.4, FLOOR = 0.22; // curtain panel width, curtain height, stage floor height
const stage = new THREE.Group();
function makeCurtain(side) { // side -1 = left panel, +1 = right panel; each scales towards its outer edge

  g.translate(side < 0 ? PW / 2 : -PW / 2, CH / 2, 0);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const f = Math.sin(pos.getX(i) * 11); // vertical folds
    pos.setZ(i, f * 0.13);
    const shade = 0.9 * (0.6 + 0.4 * (f * 0.5 + 0.5));
    col.set([0.63 * shade, 0.1 * shade, 0.22 * shade], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  m.position.set(side * PW, FLOOR, 0);

const curtainL = makeCurtain(-1), curtainR = makeCurtain(1);
const wood = new THREE.MeshLambertMaterial({ color: 0x1b1a22 });
stage.add(curtainL, curtainR);
stage.add(new THREE.Mesh(new THREE.BoxGeometry(2 * PW + 1.2, FLOOR, 3.4).translate(0, FLOOR / 2, -1.0), new THREE.MeshLambertMaterial({ color: 0x2a2230 })));
stage.add(new THREE.Mesh(new THREE.BoxGeometry(2 * PW + 0.4, 0.8, 0.4).translate(0, FLOOR + CH + 0.1, 0), new THREE.MeshLambertMaterial({ color: 0x6a1428 })));
stage.add(new THREE.Mesh(new THREE.BoxGeometry(2 * PW + 0.5, 0.08, 0.46).translate(0, FLOOR + CH - 0.32, 0), new THREE.MeshLambertMaterial({ color: 0xc9a24a, emissive: 0x3a2a08 })));
for (const sx of [-1, 1]) stage.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, CH + 1.3, 0.5).translate(sx * (PW + 0.25), (CH + 1.3) / 2, 0), wood));
// whatever is past the curtains is dark; anyone who walks beyond this panel is simply gone
stage.add(new THREE.Mesh(new THREE.PlaneGeometry(2 * PW + 0.2, CH + 0.4).translate(0, FLOOR + CH / 2, -0.9), new THREE.MeshBasicMaterial({ color: 0x000000 })));
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,196,110,0.9)'); gr.addColorStop(1, 'rgba(255,196,110,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
const glow = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 2.6).translate(0, FLOOR + 1.2, -0.85),
  new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
stage.add(glow);
const spill = new THREE.PointLight(0xffb866, 0, 9, 2); // a little warm light across the first few people when open
spill.position.set(0, 1.4, 0.9);
stage.add(spill);
// ---------- bouncers: two burly doormen in tuxedos flank the curtains, facing the line ----------
// Each is one vertex-coloured mesh built facing -z (like the crowd), then turned round to face the queue.
const limb = (a, b, t, c) => { // a box of thickness t from point a to point b
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A);
  const g = Box(t, d.length(), t).toNonIndexed();
  g.applyMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize())));

    bp(Sph(0.012, 6, 4), { p: [0, 1.12, -0.19], c: 0x0a0a0a }), bp(Sph(0.012, 6, 4), { p: [0, 1.03, -0.19], c: 0x0a0a0a }),

    bp(new THREE.ConeGeometry(0.04, 0.08, 4), { r: [0, 0, Math.PI / 2], p: [-0.04, 1.22, -0.19], c: 0x050505 }),
    bp(new THREE.ConeGeometry(0.04, 0.08, 4), { r: [0, 0, -Math.PI / 2], p: [0.04, 1.22, -0.19], c: 0x050505 }),
    bp(Box(0.09, 0.42, 0.012), { r: [0, 0, -0.32], p: [-0.12, 1.04, -0.184], c: LAP }), bp(Box(0.09, 0.42, 0.012), { r: [0, 0, 0.32], p: [0.12, 1.04, -0.184], c: LAP }),

  if (Math.random() < 0.3 && sim.line.length > 8) {
    const i = 1 + Math.floor(Math.random() * (sim.line.length - 1));
    if (sim.line[i].kind === 'npc') sim.line.splice(i, 1);
  }
  sim.line.push(mkEntry('npc')); // arrivals keep the line populated
}
// every minute (4s when sped up): curtains open, the head of the line walks through, curtains close
function simCycle(first) {
  const T = first ?? (sim.fast ? 4000 : 60000), lead = sim.fast ? 2500 : 5000, hold = sim.fast ? 3500 : 4500;
  sim.timers.push(setTimeout(() => simCurtain(true), Math.max(0, T - lead)));
  sim.timers.push(setTimeout(() => { simTick(); sim.timers.push(setTimeout(() => simCurtain(false), hold)); simCycle(); }, T));
}
function simBroadcast() {
  const L = sim.line, total = L.length;
  const i = simYou.entry ? L.indexOf(simYou.entry) : -1;
  let lo, hi;
  if (i < 0) { lo = 0; hi = Math.min(total, 60); } else { lo = Math.max(0, i - 60); hi = Math.min(total, i + 31); }
  deliver({ t: 'state', total, finished: sim.finished, players: 1, curtain: curtainOpen, head: [], pos: i < 0 ? null : i + 1, you: i < 0 ? null : simYou.entry.id,
    start: lo + 1, items: L.slice(lo, hi).map((e) => [e.id, e.seed]) });
  if (Date.now() >= nextWhisper) {
    nextWhisper = Date.now() + 7000 + Math.random() * 8000;
    deliver({ t: 'whisper', text: RUMOURS[Math.floor(Math.random() * RUMOURS.length)] });
  }
}
(function loop() { simBroadcast(); setTimeout(loop, 1000); })();
simCycle(15000); // first curtain call after 15s so the preview shows it quickly

const send = (o) => {
  if (o.t === 'rejoin' && !simYou.entry) { simYou.entry = mkEntry('you'); sim.line.push(simYou.entry); simBroadcast(); }
  // whisper, ping, away, back: nothing to do in the preview
};
$('speed').addEventListener('click', () => {
  sim.fast = !sim.fast;
  $('speed').textContent = sim.fast ? 'Normal speed' : 'Speed up';
  sim.timers.forEach(clearTimeout); sim.timers = [];
  if (curtainOpen) simCurtain(false);
  simCycle();
});

// ---------- the front of the line ----------
function showFront(m) {
  const sec = $('front');
  sec.className = `v${m.variant ?? 0}`;
  sec.hidden = false;
  $('after').hidden = true;
  $('finished').textContent = `${m.finished.toLocaleString()} have reached the front.`;
  $('wtext').value = '';
  $('wtext').disabled = false; $('wsend').disabled = false;
  setTimeout(() => { $('after').hidden = false; }, 4500);
}
$('wsend').addEventListener('click', () => {
  const text = $('wtext').value.trim();
  if (text.length >= 2) send({ t: 'whisper', text });
  $('wtext').disabled = true; $('wsend').disabled = true;
  $('wtext').value = '';
  $('wtext').placeholder = 'It drifts back down the line.';
});
$('rejoin').addEventListener('click', () => {
  send({ t: 'rejoin' });
  $('front').hidden = true;
  resetView();
});

</script>
</body>
