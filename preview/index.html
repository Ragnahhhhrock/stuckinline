<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d14">
<title>The Line</title>
<style>
:root {
  --bg: #0b0d14;
  --ink: #e9e6dc;
  --quiet: #8c93a6;
  --accent: #ffcf5c;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
  font: 16px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
body { background: #141623; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* Portrait phone first; desktop gets the same layout, centred */
#hud { position: fixed; top: calc(12px + var(--safe-t)); left: 0; right: 0; text-align: center; pointer-events: none; text-shadow: 0 1px 12px #000a; }
#pos { font-size: clamp(40px, 12vw, 64px); font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.05; }
#tally { color: var(--quiet); font-size: 15px; margin-top: 2px; font-variant-numeric: tabular-nums; }

#whisper { position: fixed; left: 24px; right: 24px; bottom: calc(84px + var(--safe-b)); text-align: center; font-style: italic;
  color: #cfd3e0; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; text-shadow: 0 1px 10px #000c; }
#whisper.on { opacity: 0.92; }

#bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px calc(12px + var(--safe-b)); background: linear-gradient(to top, #0b0d14ee, #0b0d1400); }
#status { color: var(--quiet); font-size: 14px; }
button { font: inherit; color: #14110a; background: var(--accent); border: 0; border-radius: 999px; padding: 12px 20px; min-height: 44px; font-weight: 600; }
button.quiet { background: transparent; color: var(--ink); border: 1px solid #ffffff33; }
button:active { transform: scale(0.97); }

#front { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: #000; animation: fadein 1.6s ease forwards; }
#front[hidden], #after[hidden], #elsewhere[hidden] { display: none; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
#glow { position: absolute; inset: 0; animation: pulse 4s ease-in-out infinite; }
#front.v0 #glow { background: radial-gradient(60% 45% at 50% 40%, #fff6d8 0%, #f3d98a55 45%, #0000 75%); }
#front.v1 #glow { background: linear-gradient(to bottom, #0000 0%, #1b1710 60%, #0a0805 100%), radial-gradient(30% 12% at 50% 62%, #8a6a3a66 0%, #0000 100%); }
#front.v2 #glow { background: linear-gradient(90deg, #000 0%, #000 44%, #e9e1c4 49%, #e9e1c4 51%, #000 56%, #000 100%); opacity: 0.5; }
@keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
#after { position: relative; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; text-align: center; animation: fadein 2s ease; background: #000d; border-radius: 20px; padding: 20px; }
#finished { color: var(--quiet); margin: 0 0 12px; font-variant-numeric: tabular-nums; }
#after label { color: var(--ink); }
#wtext { width: 100%; font: inherit; color: var(--ink); background: #ffffff10; border: 1px solid #ffffff2a; border-radius: 12px; padding: 12px 14px; min-height: 44px; }
.row { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }

#elsewhere { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; background: #0b0d14f2; color: var(--quiet); }


:root { color-scheme: dark; }
#bar { flex-wrap: wrap; justify-content: flex-end; }
#status { flex: 1 1 auto; font-size: 13px; }
#bar button { padding: 10px 16px; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<header id="hud">
  <div id="pos">#&ndash;</div>
  <div id="tally">joining the line&hellip;</div>
</header>

<div id="whisper" aria-live="polite"></div>

<footer id="bar">
  <div id="status">Simulated line</div>
  <button id="speed" type="button" class="quiet">Speed up</button>
  <button id="find" type="button">Find me</button>
</footer>

<section id="front" hidden>
  <div id="glow"></div>
  <div id="after" hidden>
    <p id="finished"></p>
    <label for="wtext">Leave one line for whoever is behind you.</label>
    <input id="wtext" maxlength="60" autocomplete="off" placeholder="&hellip;">
    <div class="row">
      <button id="wsend" type="button">Leave it</button>
      <button id="rejoin" type="button" class="quiet">Join the back of the line</button>
    </div>
  </div>
</section>

<div id="elsewhere" hidden>Your place is open in another tab.</div>



<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js';

const $ = (id) => document.getElementById(id);
const SP = 1.15; // spacing between people along the line
const MAX_INST = 160;

// ---------- scene ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const HORIZON = 0x141623;
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'), grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#34305a'); grad.addColorStop(0.26, '#141623'); grad.addColorStop(1, '#141623');
  g.fillStyle = grad; g.fillRect(0, 0, 2, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}
scene.fog = new THREE.Fog(HORIZON, 22, 95);
const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 200);

scene.add(new THREE.AmbientLight(0xb8bfd8, 0.9));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.1);
sun.position.set(-4, 10, 6);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshLambertMaterial({ color: 0x1a1d2b }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// avatars: one instanced body + head, low poly
const bodyGeo = new THREE.CylinderGeometry(0.27, 0.34, 0.9, 8).translate(0, 0.45, 0);
const headGeo = new THREE.SphereGeometry(0.22, 8, 6).translate(0, 1.12, 0);
const bodies = new THREE.InstancedMesh(bodyGeo, new THREE.MeshLambertMaterial({ color: 0xffffff }), MAX_INST);
const heads = new THREE.InstancedMesh(headGeo, new THREE.MeshLambertMaterial({ color: 0xffffff }), MAX_INST);
bodies.frustumCulled = heads.frustumCulled = false;
scene.add(bodies, heads);

// marker for you
const marker = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.34, 8).rotateX(Math.PI), new THREE.MeshBasicMaterial({ color: 0xffcf5c }));
const ring = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.52, 24).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffcf5c, transparent: true, opacity: 0.8 }));
marker.visible = ring.visible = false;
scene.add(marker, ring);

// the door at the front
const door = new THREE.Group();
door.add(new THREE.Mesh(new THREE.BoxGeometry(2.6, 3.4, 0.2).translate(0, 1.7, 0), new THREE.MeshLambertMaterial({ color: 0x2a2c3a })));
door.add(new THREE.Mesh(new THREE.PlaneGeometry(1.7, 2.8).translate(0, 1.5, 0.11), new THREE.MeshBasicMaterial({ color: 0xfff1c4 })));
const doorGlow = new THREE.PointLight(0xffe7a8, 2.2, 14);
doorGlow.position.set(0, 2, 1.5);
door.add(doorGlow);
door.visible = false;
scene.add(door);

// ---------- world model ----------
const curveX = (pos) => Math.sin(pos * 0.05) * 1.1 + Math.sin(pos * 0.017) * 1.6;
const hash01 = (n) => { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); };

const entities = new Map(); // id -> {x,z,tx,tz,seed}
let state = { pos: null, total: 0, start: 1, items: [], you: null };
let focusPos = 1, panOffset = 0, zoom = 1;

function applyState(s) {
  state = s;
  const seen = new Set();
  s.items.forEach(([id, seed], i) => {
    const pos = s.start + i;
    const tx = curveX(pos) + (hash01(seed) - 0.5) * 0.7;
    const tz = pos * SP; // front of the line (pos 0) is far away at z=0; the back is nearest the camera
    let e = entities.get(id);
    if (!e) { e = { x: tx, z: tz + 0.0, tx, tz, seed }; entities.set(id, e); }
    e.tx = tx; e.tz = tz;
    seen.add(id);
  });
  for (const id of entities.keys()) if (!seen.has(id)) entities.delete(id);
  $('pos').textContent = s.pos ? `#${s.pos.toLocaleString()}` : '#–';
  const others = Math.max(0, s.total - (s.pos ? 1 : 0));
  $('tally').textContent = `${s.total.toLocaleString()} in line`;
  $('tally').title = `${others.toLocaleString()} others`;
  if (s.start <= 6) { door.position.set(curveX(0), 0, 0); door.visible = true; } else door.visible = false;
}

// ---------- camera rig + gestures ----------
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function panBounds() {
  const base = state.pos ?? state.start;
  return [state.start - base, state.start + Math.max(0, state.items.length - 1) - base];
}
const ptrs = new Map();
let pinch0 = 0, zoom0 = 1, tapStart = null, lastTap = 0;
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = zoom; tapStart = null; }
  else tapStart = { t: performance.now(), x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  if (ptrs.size === 1) {
    const [lo, hi] = panBounds();
    panOffset = clamp(panOffset - (e.clientY - p.y) * 0.035 * zoom, lo, hi);
  }
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch0 > 0) zoom = clamp(zoom0 * (pinch0 / d), 0.55, 2.4);
  }
});
const endPtr = (e) => {
  ptrs.delete(e.pointerId);
  if (tapStart && performance.now() - tapStart.t < 250 && Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) < 10) {
    if (performance.now() - lastTap < 320) { panOffset = 0; zoom = 1; lastTap = 0; } else lastTap = performance.now();
  }
  tapStart = null;
};
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoom = clamp(zoom * (1 + Math.sign(e.deltaY) * 0.1), 0.55, 2.4); }, { passive: false });
$('find').addEventListener('click', () => { panOffset = 0; zoom = 1; });

// ---------- render loop ----------
const dummy = new THREE.Object3D();
const color = new THREE.Color();
let lastT = 0, elapsed = 0;

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}

function frame(now) {
  const dt = Math.min((now - (lastT || now)) / 1000, 0.1);
  lastT = now; elapsed += dt;
  const t = elapsed;
  resize();
  const k = 1 - Math.exp(-dt * 3);

  // people ease towards their target spots, so the line visibly shuffles forward
  let n = 0;
  let you = null;
  for (const [id, e] of entities) {
    if (n >= MAX_INST) break;
    e.x += (e.tx - e.x) * k; e.z += (e.tz - e.z) * k;
    const bob = Math.sin(t * 1.6 + e.seed) * 0.02;
    dummy.position.set(e.x, bob, e.z);
    dummy.rotation.y = Math.sin(e.seed) * 0.3;
    dummy.updateMatrix();
    bodies.setMatrixAt(n, dummy.matrix); heads.setMatrixAt(n, dummy.matrix);
    const isYou = id === state.you;
    if (isYou) { you = e; color.setHex(0xffcf5c); bodies.setColorAt(n, color); }
    else { color.setHSL(hash01(e.seed + 1), 0.35 + hash01(e.seed + 2) * 0.25, 0.42 + hash01(e.seed + 3) * 0.18); bodies.setColorAt(n, color); }
    color.setHSL(0.07 + hash01(e.seed + 4) * 0.05, 0.4, 0.55 + hash01(e.seed + 5) * 0.25);
    heads.setColorAt(n, color);
    n++;
  }
  bodies.count = heads.count = n;
  bodies.instanceMatrix.needsUpdate = heads.instanceMatrix.needsUpdate = true;
  if (bodies.instanceColor) bodies.instanceColor.needsUpdate = heads.instanceColor.needsUpdate = true;
  marker.visible = ring.visible = !!you;
  if (you) { marker.position.set(you.x, 1.75 + Math.sin(t * 3) * 0.06, you.z); ring.position.set(you.x, 0.02, you.z); }

  // camera: behind and above the focus, so you sit in the lower third and the line recedes upward
  const [lo, hi] = panBounds();
  panOffset = clamp(panOffset, lo, hi);
  const target = (state.pos ?? state.start) + panOffset;
  focusPos += (target - focusPos) * (1 - Math.exp(-dt * 4));
  const fz = focusPos * SP, fx = curveX(focusPos);
  camera.position.set(fx, 3.4 + 3.4 * zoom, fz + 8.5 * zoom + 2);
  camera.lookAt(curveX(focusPos - 12), 0.6, fz - 14);
  ground.position.set(camera.position.x, 0, camera.position.z);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- whispers (rumours) ----------
let whisperTimer = 0;
function showWhisper(text) {
  const el = $('whisper');
  el.textContent = `“${text}”`;
  el.classList.add('on');
  clearTimeout(whisperTimer);
  whisperTimer = setTimeout(() => el.classList.remove('on'), 6500);
}


// ---------- simulated server (preview only: no network; same messages as the real server) ----------
const RUMOURS = [
  "someone said it's a door",
  'my cousin got to the front in March',
  "they say it's warm in there",
  "I heard it's only open to people who waited",
  'the person ahead of me has been here since before I was born',
  "don't look at the light for too long",
  "somebody told me there's nothing at all",
  "it's a ticket. it has to be a ticket",
  'I saw someone come back. they would not speak',
  'the line has moved faster since the rain',
  "my grandmother says it's a boat",
  'nobody who reached the front has written to me',
  "it's a trick of the light, that's all",
  "I think it's a kindness",
  'they closed the door on the last one a bit softly',
  'if you stop wondering, it moves faster',
  'there was a sound last night, like a kettle',
  'ask the one in the green coat. no, never mind',
  "I don't care what it is any more. I'm staying",
  'somebody swears they smelled bread',
];
const sim = { line: [], nextId: 1, finished: 1847, fast: false };
const mkEntry = (kind) => ({ id: sim.nextId++, seed: Math.floor(Math.random() * 1e6), kind });
for (let i = 0; i < 38; i++) sim.line.push(mkEntry('npc'));
const simYou = { entry: mkEntry('you') };
sim.line.push(simYou.entry);
for (let i = 0; i < 26; i++) sim.line.push(mkEntry('npc'));
let nextWhisper = Date.now() + 2500;

function deliver(m) {
  if (m.t === 'state') applyState(m);
  else if (m.t === 'whisper') showWhisper(m.text);
  else if (m.t === 'front') showFront(m);
}
function simTick() {
  const front = sim.line.shift();
  if (front) {
    sim.finished++;
    if (front === simYou.entry) { simYou.entry = null; deliver({ t: 'front', finished: sim.finished, variant: Math.floor(Math.random() * 3) }); }
  }
  if (Math.random() < 0.3 && sim.line.length > 8) {
    const i = 1 + Math.floor(Math.random() * (sim.line.length - 1));
    if (sim.line[i].kind === 'npc') sim.line.splice(i, 1);
  }
  sim.line.push(mkEntry('npc')); // arrivals keep the line populated
  setTimeout(simTick, (sim.fast ? 350 : 3500) * (0.6 + Math.random() * 0.8));
}
function simBroadcast() {
  const L = sim.line, total = L.length;
  const i = simYou.entry ? L.indexOf(simYou.entry) : -1;
  let lo, hi;
  if (i < 0) { lo = 0; hi = Math.min(total, 60); } else { lo = Math.max(0, i - 60); hi = Math.min(total, i + 31); }
  deliver({ t: 'state', total, finished: sim.finished, players: 1, pos: i < 0 ? null : i + 1, you: i < 0 ? null : simYou.entry.id,
    start: lo + 1, items: L.slice(lo, hi).map((e) => [e.id, e.seed]) });
  if (Date.now() >= nextWhisper) {
    nextWhisper = Date.now() + 7000 + Math.random() * 8000;
    deliver({ t: 'whisper', text: RUMOURS[Math.floor(Math.random() * RUMOURS.length)] });
  }
}
(function loop() { simBroadcast(); setTimeout(loop, sim.fast ? 400 : 1000); })();
setTimeout(simTick, 3500);

const send = (o) => {
  if (o.t === 'rejoin' && !simYou.entry) { simYou.entry = mkEntry('you'); sim.line.push(simYou.entry); simBroadcast(); }
  // whisper, ping, away, back: nothing to do in the preview
};
$('speed').addEventListener('click', () => {
  sim.fast = !sim.fast;
  $('speed').textContent = sim.fast ? 'Normal speed' : 'Speed up';
});

// ---------- the front of the line ----------
function showFront(m) {
  const sec = $('front');
  sec.className = `v${m.variant ?? 0}`;
  sec.hidden = false;
  $('after').hidden = true;
  $('finished').textContent = `${m.finished.toLocaleString()} have reached the front.`;
  $('wtext').value = '';
  $('wtext').disabled = false; $('wsend').disabled = false;
  setTimeout(() => { $('after').hidden = false; }, 4500);
}
$('wsend').addEventListener('click', () => {
  const text = $('wtext').value.trim();
  if (text.length >= 2) send({ t: 'whisper', text });
  $('wtext').disabled = true; $('wsend').disabled = true;
  $('wtext').value = '';
  $('wtext').placeholder = 'It drifts back down the line.';
});
$('rejoin').addEventListener('click', () => {
  send({ t: 'rejoin' });
  $('front').hidden = true;
  panOffset = 0; zoom = 1;
});

</script>
</body>
</html>
