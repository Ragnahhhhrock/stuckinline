# Stuck in Line on Cloudflare Workers: static assets plus one Durable Object that holds the global line.
# Deploy: npm run build:worker && npx wrangler deploy   (CI does this on every push to main; see DEPLOY.md)
name = "stuckinline"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Custom domains: stuckinline.com and www. (Cloudflare creates the DNS records and certificates itself.)
routes = [
  { pattern = "stuckinline.com", custom_domain = true },
  { pattern = "www.stuckinline.com", custom_domain = true },
]

[observability]
enabled = true

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "none"
# /ws is handled by the Worker; everything else is served straight from the assets.
run_worker_first = ["/ws", "/healthz", "/stripe-webhook"]

[[durable_objects.bindings]]
name = "LINE"
class_name = "LineRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LineRoom"]

# Optional game settings: TICK_MS (60000), INITIAL_NPCS (200), NPC_FADE_PLAYERS (50), GRACE_MS (30000), MAX_PLAYERS (5000)
# Secret (set with `npx wrangler secret put STRIPE_WEBHOOK_SECRET`, never committed): the Stripe webhook signing secret.
# Optional: SKIP_MIN_CENTS (500) = smallest paid amount, in AUD cents, that counts as a paid skip.
# [vars]
# TICK_MS = "60000"
